<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study guide · PSC Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<nav class="topbar" aria-label="Guide">
  <div class="in">
    <a class="home" href="./">← PSC Prep</a>
    <span class="ttl" id="ttl"></span>
    <button class="btn" id="hide" type="button" aria-pressed="false">Hide answers</button>
  </div>
</nav>
<div class="reader">
  <details class="sheet toc" id="toc" open><summary>Contents</summary><ol id="tocl"></ol></details>
  <article class="sheet doc" id="doc"><p class="status">Loading…</p></article>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="assets/library.js"></script>
<script>
(function(){
  const doc = document.getElementById("doc");
  const slug = new URLSearchParams(location.search).get("doc") || "";
  const subject = window.LIBRARY.groups.flatMap(g => g.subjects).find(s => s.doc && s.doc === slug);
  if (!subject) { doc.innerHTML = '<p class="status">No study guide by that name. <a href="./">Back to all guides</a>.</p>'; return; }
  document.title = subject.title + " · PSC Prep";
  document.getElementById("ttl").textContent = subject.title;

  const slugify = t => t.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

  fetch("notes/" + subject.doc + ".md").then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }).then(md => {
    doc.innerHTML = DOMPurify.sanitize(marked.parse(md));

    // Formula blocks (```math or ```latex) → KaTeX
    doc.querySelectorAll("pre > code.language-math, pre > code.language-latex").forEach(code => {
      const box = document.createElement("div"); box.className = "math";
      try { katex.render(code.textContent.trim(), box, { displayMode: true, throwOnError: false }); }
      catch (e) { box.textContent = code.textContent; }
      code.parentElement.replaceWith(box);
    });

    // Wide tables scroll inside their own box
    doc.querySelectorAll("table").forEach(t => { const s = document.createElement("div"); s.className = "tscroll"; t.replaceWith(s); s.append(t); });

    // Past questions: bold "Q1." paragraphs, italic "Answer:" paragraphs
    doc.querySelectorAll("p").forEach(p => {
      const first = p.firstElementChild, lead = p.textContent.trim();
      if (first && first.tagName === "STRONG" && /^Q\d+\./.test(lead)) p.classList.add("q");
      if (first && first.tagName === "EM" && /^Answer:/.test(lead)) {
        p.classList.add("ans");
        const b = document.createElement("button"); b.type = "button"; b.className = "reveal"; b.textContent = "Show answer";
        b.addEventListener("click", () => { p.classList.add("shown"); b.classList.add("used"); });
        p.before(b);
      }
    });

    // Contents from the h2 headings
    const tocl = document.getElementById("tocl");
    const links = [];
    doc.querySelectorAll("h2").forEach(h => {
      h.id = slugify(h.textContent);
      const li = document.createElement("li"), a = document.createElement("a");
      a.href = "#" + h.id; a.textContent = h.textContent; li.append(a); tocl.append(li); links.push([h, a]);
    });
    if (matchMedia("(max-width:900px)").matches) document.getElementById("toc").open = false;
    const spy = () => {
      let cur = links[0];
      links.forEach(l => { if (l[0].getBoundingClientRect().top < 120) cur = l; });
      links.forEach(l => l[1].classList.toggle("on", l === cur));
    };
    addEventListener("scroll", spy, { passive: true }); spy();
    if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
  }).catch(() => {
    doc.innerHTML = '<p class="status">Could not load this guide. If you opened the file directly, serve the folder over http (for example <code>python -m http.server</code>) or use the GitHub page.</p>';
  });

  // Hide answers toggle (remembered per browser)
  const btn = document.getElementById("hide"), KEY = "psc-prep-hide-answers";
  const set = on => {
    btn.setAttribute("aria-pressed", on); doc.classList.toggle("hide-ans", on);
    if (on) doc.querySelectorAll(".ans.shown").forEach(p => { p.classList.remove("shown"); p.previousElementSibling?.classList.remove("used"); });
    try { localStorage.setItem(KEY, on ? "1" : "0"); } catch (e) {}
  };
  let saved = false; try { saved = localStorage.getItem(KEY) === "1"; } catch (e) {}
  set(saved);
  btn.addEventListener("click", () => set(btn.getAttribute("aria-pressed") !== "true"));
})();
</script>
</body>
</html>
